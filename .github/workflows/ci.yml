name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      # The prepare script runs bob build; the build is run explicitly below
      # so a build failure is reported as its own step.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  example:
    name: Typecheck example app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install library dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build library
        run: yarn build

      - name: Install example dependencies
        run: yarn --cwd example install --frozen-lockfile --ignore-scripts

      - name: Typecheck example
        run: yarn --cwd example typecheck
